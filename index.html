<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaat Attendance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* Global Day Selector */
        .global-day-selector {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .global-day-selector h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .day-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .day-btn {
            padding: 10px 15px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .day-btn:hover {
            border-color: #667eea;
            background: #f9f9f9;
        }

        .day-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Dashboard Styles */
        .dashboard-section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dashboard-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }

        .sector-summary {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .sector-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }

        .sector-name {
            font-weight: bold;
            color: #333;
        }

        .sector-details {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            flex-wrap: wrap;
        }

        .sector-detail {
            color: #666;
        }

        /* Detail Page Styles */
        .detail-section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .detail-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .category-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 3px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .category-card.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .category-code {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .category-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .category-count {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .legend-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .legend-code {
            font-weight: bold;
            min-width: 30px;
            color: #667eea;
            font-size: 1.1em;
        }

        .legend-description {
            font-size: 0.9em;
            color: #666;
        }

        .data-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .data-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .sectors {
            margin-bottom: 20px;
        }

        .sector {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .sector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .sector-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .sector-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .sector-toggle {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        .sector-content {
            display: none;
            margin-top: 15px;
        }

        .sector-content.expanded {
            display: block;
        }

        .person-list {
            list-style: none;
        }

        .person-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #764ba2;
        }

        .person-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .person-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 0.85em;
            color: #666;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-weight: bold;
            color: #333;
        }

        .detail-value {
            color: #666;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #3c3;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .categories {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .header h1 {
                font-size: 1.8em;
            }

            .nav {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }

            .day-selector {
                gap: 5px;
            }

            .day-btn {
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Jamaat Attendance Dashboard</h1>
            <p>10-Day Program Attendance Tracking (Day 2-10)</p>
        </div>

        <!-- Global Day Selector -->
        <div class="global-day-selector">
            <h3>📅 Select Day (Applies to All Pages):</h3>
            <div class="day-selector" id="globalDaySelector"></div>
        </div>

        <!-- Navigation -->
        <div class="nav">
            <button class="nav-btn active" onclick="switchPage('dashboard')">📈 Dashboard</button>
            <button class="nav-btn" onclick="switchPage('details')">📋 Detail Table</button>
        </div>

        <!-- Dashboard Page -->
        <div id="dashboard" class="page active">
            <div class="dashboard-section">
                <h2>📈 Statistics for <span id="dashboardDayLabel">Day 2</span></h2>
                <div class="stats-grid" id="overallStats"></div>
            </div>

            <div class="dashboard-section">
                <h2>📈 Attendance Breakdown</h2>
                <div class="charts-grid">
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="dashboard-section">
                <h2>🏢 Sector-wise Summary</h2>
                <div class="sector-summary" id="sectorSummary"></div>
            </div>

            <div id="message"></div>
        </div>

        <!-- Detail Table Page -->
        <div id="details" class="page">
            <div class="detail-section">
                <h2>🗂️ Attendance Details for <span id="detailDayLabel">Day 2</span></h2>
                <!--
                <div class="legend">
                    <div class="legend-item">
                        <span class="legend-code">w</span>
                        <span class="legend-description">Attended in My Jamaat</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-code">x</span>
                        <span class="legend-description">Mehmaan (Guest) in My Jamaat</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-code">y</span>
                        <span class="legend-description">Late in My Jamaat</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-code">z</span>
                        <span class="legend-description">Late in Other Jamaat</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-code">a</span>
                        <span class="legend-description">Absent</span>
                    </div>
                </div>
                -->
                <h3 style="margin-bottom: 15px; color: #333;">Select Category:</h3>
                <div class="categories" id="categories"></div>

                <div class="data-section" id="dataContainer" style="display: none;">
                    <h2 id="dataTitle">Attendance Data</h2>
                    <div id="dataContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
