<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaat Attendance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .config-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .config-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 300px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        .input-group button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #5568d3;
        }

        .input-group button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .category-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 3px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .category-card.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .category-code {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .category-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .category-count {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .data-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .data-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .sectors {
            margin-bottom: 20px;
        }

        .sector {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .sector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .sector-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .sector-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .sector-toggle {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        .sector-content {
            display: none;
            margin-top: 15px;
        }

        .sector-content.expanded {
            display: block;
        }

        .person-list {
            list-style: none;
        }

        .person-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #764ba2;
        }

        .person-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .person-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 0.85em;
            color: #666;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-weight: bold;
            color: #333;
        }

        .detail-value {
            color: #666;
            margin-top: 2px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            padding: 20px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #3c3;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .categories {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .header h1 {
                font-size: 1.8em;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input,
            .input-group button {
                width: 100%;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Jamaat Attendance Dashboard</h1>
            <p>Real-time attendance tracking from Google Sheets</p>
        </div>

        <div class="config-section">
            <h2>Configuration</h2>
            <div class="input-group">
                <input 
                    type="text" 
                    id="sheetUrl" 
                    placeholder="Enter Google Sheet URL (e.g., https://docs.google.com/spreadsheets/d/...)" 
                    value="https://docs.google.com/spreadsheets/d/161tCOlKVaV4AHyi6UmsxbWsnvPKBhFyzhPOEUlXktI8/edit?gid=108774125#gid=108774125"
                >
                <button onclick="loadData()">Load Data</button>
                <button onclick="refreshData()">🔄 Refresh</button>
            </div>
            <div id="message"></div>
        </div>

        <div id="categoriesContainer">
            <div class="categories" id="categories"></div>
        </div>

        <div id="dataContainer" class="data-section" style="display: none;">
            <h2 id="dataTitle">Attendance Data</h2>
            <div id="dataContent"></div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
